<body>
  <h1>Finanzas (offline)</h1>

  <h3>Inputs</h3>

  <label>
    Ingresos (anual):
    <input id="ing" type="number">
  </label><br><br>

  <label>
    Egresos (anual):
    <input id="egr" type="number">
  </label><br><br>

  <label>
    Inversión inicial (CapEx t=0):
    <input id="capex0" type="number">
  </label><br><br>

  <label>
    Años:
    <input id="years" type="number" value="5">
  </label><br><br>

  <label>
    Tasa descuento (%):
    <input id="rate" type="number" value="25">
  </label><br><br>

  <button id="btn">Calcular</button>
  <pre id="out"></pre>

  <hr>

  <h3>Escenarios</h3>

  <label>
    Nombre:
    <input id="scName" type="text">
  </label>
  <button id="saveSc">Guardar</button>
  <button id="newSc">Nuevo</button>

  <br><br>

  <label>
    Cargar:
    <select id="scList"></select>
  </label>
  <button id="loadSc">Cargar</button>
  <button id="delSc">Eliminar</button>

  <script src="app.js"></script>
  <script src="engine.js"></script>
<script src="app.js"></script>

</body>
